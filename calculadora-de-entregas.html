<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora EPTC</title>
  <meta name="theme-color" content="#172033">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icone-eptc.svg">
  <style>
    :root { --ink:#172033; --muted:#65718b; --line:#dce3ef; --paper:#fff; --canvas:#f4f7fb; --blue:#2e5bff; --green:#07875f; --red:#c03642; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:radial-gradient(circle at 8% 0%, #e8efff 0, transparent 32rem),var(--canvas); font-family:Inter,Segoe UI,Arial,sans-serif; }
    main { width:min(100%, 680px); background:var(--paper); border:1px solid var(--line); border-radius:24px; box-shadow:0 18px 55px #17203318; overflow:hidden; }
    header { padding:32px 34px 25px; background:#172033; color:#fff; }
    .eyebrow { margin:0 0 9px; color:#aebeff; font-size:.76rem; font-weight:750; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(1.65rem,5vw,2.25rem); letter-spacing:-.04em; }
    header p { max-width:39rem; margin:12px 0 0; color:#d8dff1; line-height:1.5; }
    .content { padding:30px 34px 34px; }
    form { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    label { display:grid; gap:8px; font-size:.94rem; font-weight:700; }
    input { width:100%; padding:14px; border:1px solid var(--line); border-radius:12px; color:var(--ink); font:inherit; font-size:1.1rem; font-weight:700; outline:none; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 4px #2e5bff20; }
    .actions { grid-column:1/-1; display:flex; gap:10px; margin-top:2px; }
    button { border:0; border-radius:12px; padding:13px 18px; font:inherit; font-weight:750; cursor:pointer; }
    #calculate { color:#fff; background:var(--blue); }
    #clear { color:var(--ink); background:#edf1f7; }
    #install { color:var(--blue); background:#e8efff; }
    .result { margin-top:28px; padding:25px; border-radius:18px; background:#f7faff; border:1px solid #dbe6ff; text-align:center; }
    .result-label { margin:0; color:var(--muted); font-size:.85rem; font-weight:750; letter-spacing:.06em; text-transform:uppercase; }
    #percentage { display:block; margin:7px 0 3px; color:var(--green); font-size:clamp(3rem,11vw,5rem); font-weight:800; letter-spacing:-.08em; line-height:1; }
    #summary { margin:0; color:var(--ink); font-size:1rem; }
    .meter { height:12px; margin:22px 0 0; overflow:hidden; border-radius:99px; background:#dce5f4; }
    #bar { height:100%; width:0%; border-radius:inherit; background:linear-gradient(90deg, #2e5bff, #08a879); transition:width .35s ease; }
    #error { min-height:1.2em; margin:12px 0 0; color:var(--red); font-size:.92rem; font-weight:650; text-align:center; }
    .formula { margin:23px 0 0; color:var(--muted); font-size:.85rem; line-height:1.5; text-align:center; }
    @media (max-width:520px) { body { padding:12px; } header,.content { padding:25px 21px; } form { grid-template-columns:1fr; } .actions { grid-column:auto; } button { flex:1; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Controle de rota</p>
      <h1>Calculadora EPTC</h1>
      <p>Descubra quantos objetos foram entregues e a sua porcentagem de entrega.</p>
    </header>
    <section class="content" aria-label="Dados da entrega">
      <form id="form" novalidate>
        <label for="sent">Objetos que saíram
          <input id="sent" type="number" inputmode="numeric" min="1" step="1" value="50" required>
        </label>
        <label for="returned">Objetos que voltaram
          <input id="returned" type="number" inputmode="numeric" min="0" step="1" value="8" required>
        </label>
        <div class="actions">
          <button id="calculate" type="submit">Calcular</button>
          <button id="clear" type="button">Limpar</button>
          <button id="install" type="button" hidden>Instalar app</button>
        </div>
      </form>
      <div class="result" aria-live="polite">
        <p class="result-label">Porcentagem de entrega</p>
        <output id="percentage">84%</output>
        <p id="summary">42 de 50 objetos foram entregues</p>
        <div class="meter" role="progressbar" aria-label="Porcentagem de entrega" aria-valuemin="0" aria-valuemax="100" aria-valuenow="84"><div id="bar" style="width:84%"></div></div>
      </div>
      <p id="error" role="alert"></p>
      <p class="formula">Cálculo: (objetos que saíram − objetos que voltaram) ÷ objetos que saíram × 100</p>
    </section>
  </main>
  <script>
    const form = document.getElementById('form');
    const sentInput = document.getElementById('sent');
    const returnedInput = document.getElementById('returned');
    const percentage = document.getElementById('percentage');
    const summary = document.getElementById('summary');
    const bar = document.getElementById('bar');
    const meter = document.querySelector('.meter');
    const error = document.getElementById('error');
    const installButton = document.getElementById('install');
    const format = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });

    function calculate() {
      const sent = Number(sentInput.value);
      const returned = Number(returnedInput.value);
      error.textContent = '';
      if (!Number.isFinite(sent) || sent <= 0) { error.textContent = 'Informe uma quantidade de saída maior que zero.'; return; }
      if (!Number.isFinite(returned) || returned < 0) { error.textContent = 'A quantidade que voltou não pode ser negativa.'; return; }
      if (returned > sent) { error.textContent = 'A quantidade que voltou não pode ser maior que a quantidade que saiu.'; return; }
      const delivered = sent - returned;
      const rate = (delivered / sent) * 100;
      percentage.textContent = `${format.format(rate)}%`;
      summary.textContent = `${format.format(delivered)} de ${format.format(sent)} objetos foram entregues`;
      bar.style.width = `${rate}%`;
      meter.setAttribute('aria-valuenow', rate.toFixed(2));
    }
    form.addEventListener('submit', event => { event.preventDefault(); calculate(); });
    [sentInput, returnedInput].forEach(input => input.addEventListener('input', () => { if (sentInput.value && returnedInput.value) calculate(); }));
    document.getElementById('clear').addEventListener('click', () => { sentInput.value = ''; returnedInput.value = ''; percentage.textContent = '—'; summary.textContent = 'Preencha os valores para calcular'; bar.style.width = '0%'; meter.setAttribute('aria-valuenow', '0'); error.textContent = ''; sentInput.focus(); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
    let installPrompt;
    window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); installPrompt = event; installButton.hidden = false; });
    installButton.addEventListener('click', async () => { if (!installPrompt) return; installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; installButton.hidden = true; });
  </script>
</body>
</html>
